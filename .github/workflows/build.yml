name: build-pkg

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: ps3dev/ps3dev:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compilar e montar o pkg
        run: make pkg

      - name: Enviar pkg
        uses: actions/upload-artifact@v4
        with:
          name: cobra_arena-pkg
          path: cobra_arena.pkg